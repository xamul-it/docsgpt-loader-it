# Elenco curato delle fonti documentali per locazioni (Bologna, Pre-Saint-Didier, Castiglione della Pescaia)
# Ricerca del 2026-11-09. Letto da downloader.py (kind "curated"): una sorgente per ogni id,
# `nome` e il nome della sorgente su DocsGPT; si scaricano solo le voci con verificato: "si".
# Legenda verificato: si = URL aperto e contenuto corrispondente al titolo; no = non aperto, non identificabile o non trovato.
# Nota Normattiva: gli URL N2Ls?urn:nir:... sono lo schema URN ufficiale; sono stati aperti uno per uno (non solo dedotti).
# Nota: il testo di Normattiva risulta HTML statico (JS solo per navigazione); per atti lunghi (codice civile) usare "visualizza atto intero"/export.
# Nota: le date di Normattiva/Regioni nel 2026 sono quelle riportate dalle pagine al momento della verifica.

